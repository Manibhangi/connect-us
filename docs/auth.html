<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect Us</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
      

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            padding: 30px;
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 32px;
            color: #2563eb;
            font-weight: bold;
        }

        .tagline {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            width: 50%;
            padding: 12px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #777;
        }

        .tab.active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
        }

        .form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .main-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-btn:hover {
            background: #1d4ed8;
        }

        .secondary-btn {
            width: 100%;
            height: 42px;
            border: 1px solid #2563eb;
            border-radius: 8px;
            background: white;
            color: #2563eb;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            background: #eff6ff;
        }

        .forgot {
            text-align: right;
            margin: 12px 0 15px;
        }

        .forgot button {
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        .forgot button:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
        }

        #registrationOTPSection,
        #forgotSection {
            margin-top: 20px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        #registrationOTP,
        #otp {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        small {
            display: block;
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }

        .back-btn {
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="logo">
        <h1>ConnectUs</h1>
    </div>

    <div class="tagline">
        For the People, By the People
    </div>


    <!-- TABS -->

    <div class="tabs" id="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()">
            Login
        </button>

        <button
            class="tab"
            id="registerTab"
            onclick="showRegister()">
            Register
        </button>

    </div>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="loginPage">

        <form
            id="loginForm"
            class="form"
            onsubmit="handleLogin(event)">

            <div class="form-group">

                <label>Email or Phone</label>

                <input
                    type="text"
                    id="loginEmail"
                    placeholder="Enter email or phone"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="forgot">

                <button
                    type="button"
                    onclick="showForgotPassword()">
                    Forgot Password?
                </button>

            </div>


            <button
                type="submit"
                class="main-btn">
                Login
            </button>


            <div
                id="loginMessage"
                class="message">
            </div>

        </form>

    </div>


    <!-- ========================= -->
    <!-- REGISTER -->
    <!-- ========================= -->

    <div id="registerPage" class="hidden">

        <form
            id="registerForm"
            class="form"
            onsubmit="sendRegistrationOTP(event)">

            <!-- FULL NAME -->

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Enter phone number"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter email"
                    required>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    id="registerLocation"
                    placeholder="Enter your location"
                    required>

            </div>


            <!-- ACCOUNT TYPE -->

            <div class="form-group">

                <label>Account Type</label>

                <select
                    id="registerRole"
                    required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="worker">
                        Worker
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    minlength="6"
                    required>

            </div>


            <!-- SEND OTP -->

            <button
                type="submit"
                class="main-btn"
                id="sendRegistrationOTPButton">

                Send Verification OTP

            </button>


            <!-- REGISTRATION OTP -->

            <div
                id="registrationOTPSection"
                style="display:none;">

                <div class="form-group">

                    <label>Email Verification OTP</label>

                    <input
                        type="text"
                        id="registrationOTP"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric">

                    <small>
                        We sent a 6-digit OTP to your email.
                    </small>

                </div>


                <button
                    type="button"
                    class="main-btn"
                    id="verifyRegistrationButton"
                    onclick="verifyRegistrationOTP()">

                    Verify Email & Create Account

                </button>

            </div>


            <div
                id="registerMessage"
                class="message">
            </div>

        </form>

    </div>


    <!-- ========================= -->
    <!-- FORGOT PASSWORD -->
    <!-- ========================= -->

    <div id="forgotPage" class="hidden">

        <button
            class="back-btn"
            onclick="showLogin()">
            ← Back to Login
        </button>


        <h2 style="margin-bottom:20px;">
            Reset Password
        </h2>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your email">

        </div>


        <button
            type="button"
            class="main-btn"
            onclick="sendForgotOTP()">

            Send OTP

        </button>


        <div
            id="forgotSection"
            style="display:none;">

            <div class="form-group">

                <label>OTP</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    inputmode="numeric">

            </div>


            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6">

            </div>


            <button
                type="button"
                class="main-btn"
                onclick="resetPassword()">

                Reset Password

            </button>

        </div>


        <div
            id="forgotMessage"
            class="message">
        </div>

    </div>

</div>


<script>

    // =========================
    // API URL
    // =========================

    const API_URL = "https://connect-us-br0m.onrender.com/api";


    // =========================
    // MESSAGE FUNCTION
    // =========================

    function showMessage(elementId, message, type) {

        const element = document.getElementById(elementId);

        element.textContent = message;

        element.className = "message " + type;

    }


    // =========================
    // SHOW LOGIN
    // =========================

    function showLogin() {

        document.getElementById("loginPage")
            .classList.remove("hidden");

        document.getElementById("registerPage")
            .classList.add("hidden");

        document.getElementById("forgotPage")
            .classList.add("hidden");

        document.getElementById("loginTab")
            .classList.add("active");

        document.getElementById("registerTab")
            .classList.remove("active");

    }


    // =========================
    // SHOW REGISTER
    // =========================

    function showRegister() {

        document.getElementById("loginPage")
            .classList.add("hidden");

        document.getElementById("registerPage")
            .classList.remove("hidden");

        document.getElementById("forgotPage")
            .classList.add("hidden");

        document.getElementById("loginTab")
            .classList.remove("active");

        document.getElementById("registerTab")
            .classList.add("active");

    }


    // =========================
    // SHOW FORGOT PASSWORD
    // =========================

    function showForgotPassword() {

        document.getElementById("loginPage")
            .classList.add("hidden");

        document.getElementById("registerPage")
            .classList.add("hidden");

        document.getElementById("forgotPage")
            .classList.remove("hidden");

        document.getElementById("tabs")
            .style.display = "none";

    }


    // =========================
    // LOGIN
    // =========================

    async function handleLogin(event) {

        event.preventDefault();

        const loginUser =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        try {

            const response = await fetch(
                API_URL + "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        loginUser,
                        password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    "loginMessage",
                    data.message || "Login failed",
                    "error"
                );

                return;
            }


            localStorage.setItem(
                "connectUsToken",
                data.token
            );

            localStorage.setItem(
                "connectUsUser",
                JSON.stringify(data.user)
            );


            showMessage(
                "loginMessage",
                "Login successful!",
                "success"
            );


            setTimeout(() => {

                if (data.user.role === "customer") {

                    window.location.href = "customer.html";

                } else if (data.user.role === "worker") {

                    window.location.href = "worker.html";

                } else {

                    window.location.href = "index.html";

                }

            }, 700);

        }

        catch (error) {

            console.error(error);

            showMessage(
                "loginMessage",
                "Cannot connect to server. Make sure backend is running.",
                "error"
            );

        }

    }


    // =========================
    // SEND REGISTRATION OTP
    // =========================

    async function sendRegistrationOTP(event) {

        event.preventDefault();


        const name =
            document.getElementById("registerName").value.trim();

        const phone =
            document.getElementById("registerPhone").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const location =
            document.getElementById("registerLocation").value.trim();

        const role =
            document.getElementById("registerRole").value;

        const password =
            document.getElementById("registerPassword").value;


        try {

            const response = await fetch(
                API_URL + "/auth/register/send-otp",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        phone,
                        email,
                        location,
                        role,
                        password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    "registerMessage",
                    data.message || "Failed to send OTP",
                    "error"
                );

                return;
            }


            showMessage(
                "registerMessage",
                data.message || "OTP sent successfully",
                "success"
            );


            document.getElementById(
                "registrationOTPSection"
            ).style.display = "block";


            document.getElementById(
                "sendRegistrationOTPButton"
            ).style.display = "none";

        }

        catch (error) {

            console.error(error);

            showMessage(
                "registerMessage",
                "Cannot connect to server.",
                "error"
            );

        }

    }


    // =========================
    // VERIFY REGISTRATION OTP
    // =========================

    async function verifyRegistrationOTP() {

        const email =
            document.getElementById("registerEmail").value.trim();

        const otp =
            document.getElementById("registrationOTP").value.trim();


        if (!otp) {

            showMessage(
                "registerMessage",
                "Please enter the OTP.",
                "error"
            );

            return;
        }


        try {

            const response = await fetch(
                API_URL + "/auth/register/verify-otp",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        otp
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    "registerMessage",
                    data.message || "Invalid OTP",
                    "error"
                );

                return;
            }


            localStorage.setItem(
                "connectUsToken",
                data.token
            );

            localStorage.setItem(
                "connectUsUser",
                JSON.stringify(data.user)
            );


            showMessage(
                "registerMessage",
                "Account created successfully!",
                "success"
            );


            setTimeout(() => {

                if (data.user.role === "customer") {

                    window.location.href = "customer.html";

                } else if (data.user.role === "worker") {

                    window.location.href = "worker.html";

                }

            }, 1000);

        }

        catch (error) {

            console.error(error);

            showMessage(
                "registerMessage",
                "Cannot connect to server.",
                "error"
            );

        }

    }


    // =========================
    // SEND FORGOT PASSWORD OTP
    // =========================

    async function sendForgotOTP() {

        const email =
            document.getElementById("forgotEmail").value.trim();


        if (!email) {

            showMessage(
                "forgotMessage",
                "Please enter your email.",
                "error"
            );

            return;
        }


        try {

            const response = await fetch(
                API_URL + "/auth/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    "forgotMessage",
                    data.message || "Failed to send OTP",
                    "error"
                );

                return;
            }


            document.getElementById(
                "forgotSection"
            ).style.display = "block";


            showMessage(
                "forgotMessage",
                data.message || "OTP sent successfully",
                "success"
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "forgotMessage",
                "Cannot connect to server.",
                "error"
            );

        }

    }


    // =========================
    // RESET PASSWORD
    // =========================

    async function resetPassword() {

        const email =
            document.getElementById("forgotEmail").value.trim();

        const otp =
            document.getElementById("otp").value.trim();

        const newPassword =
            document.getElementById("newPassword").value;


        if (!otp || !newPassword) {

            showMessage(
                "forgotMessage",
                "Please enter OTP and new password.",
                "error"
            );

            return;
        }


        try {

            const response = await fetch(
                API_URL + "/auth/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        otp,
                        newPassword
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    "forgotMessage",
                    data.message || "Password reset failed",
                    "error"
                );

                return;
            }


            showMessage(
                "forgotMessage",
                "Password reset successfully!",
                "success"
            );


            setTimeout(() => {

                document.getElementById("tabs")
                    .style.display = "flex";

                showLogin();

            }, 1500);

        }

        catch (error) {

            console.error(error);

            showMessage(
                "forgotMessage",
                "Cannot connect to server.",
                "error"
            );

        }

    }

</script>

    <script src="js/settings.js"></script>
</body>
</html>
